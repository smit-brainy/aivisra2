<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/brainy-neurals-design-system-326a1f72-00bc-4ae7-9c61-01f8fa61e24f/colors_and_type.css">
  <script src="invr-data.js"></script>
</helmet>
<div ref="{{ rootRef }}" style="position:relative; font-family: var(--font-sans); color: var(--ink);">
  <button onClick="{{ toggleOpen }}" aria-expanded="{{ open }}" style="height: 52px; min-width: 260px; padding: 0 14px; display:flex; align-items:center; gap: 12px; border: 1px solid {{ trigBorder }}; border-radius: 8px; background: var(--paper); text-align:left;" style-hover="border-color: var(--ink);">
    <span style="display:flex; flex-direction:column; gap: 4px; flex:1; min-width:0;">
      <span style="font: 500 10.5px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);">Time · {{ presetLabel }}</span>
      <span style="font-size: 15px; font-weight: 500; white-space:nowrap;">{{ rangeText }}</span>
    </span>
    <span style="font-size: 12px; color: var(--muted);">▾</span>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute; top: calc(100% + 6px); left: 0; z-index: 50; width: 420px; max-height: 720px; overflow:auto; display:flex; flex-direction:column; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 30px 60px -30px rgba(10,10,11,.35), 0 2px 6px rgba(10,10,11,.06); overflow:hidden;">
      <div style="padding: 8px 0;">
        <sc-if value="{{ showPresets }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="7">
          <button onClick="{{ it.pick }}" style="width:100%; height: 44px; display:flex; align-items:center; justify-content:space-between; gap: 12px; padding: 0 16px; background: {{ it.bg }}; text-align:left;" style-hover="background: var(--blue-tint); color: var(--blue-deep);">
            <span style="display:flex; align-items:center; gap: 10px; font-size: 15px; font-weight: {{ it.weight }};"><span style="width: 6px; height: 6px; background: {{ it.mark }};"></span>{{ it.label }}</span>
            <span style="font: 500 12px/1 var(--font-mono); color: var(--muted); white-space:nowrap;">{{ it.range }}</span>
          </button>
        </sc-for>
        <button onClick="{{ toggleCustom }}" style="width:100%; height: 44px; display:flex; align-items:center; justify-content:space-between; gap: 12px; padding: 0 16px; margin-top: 4px; border-top: 1px solid var(--line-soft); background: {{ customBg }}; text-align:left;" style-hover="background: var(--blue-tint); color: var(--blue-deep);">
          <span style="display:flex; align-items:center; gap: 10px; font-size: 15px; font-weight: {{ customWeight }};"><span style="width: 6px; height: 6px; background: {{ customMark }};"></span>Pick dates and times</span>
          <span style="font-size: 12px; color: var(--muted);">{{ customCaret }}</span>
        </button>
        </sc-if>
        <sc-if value="{{ showCustom }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; flex-direction:column; gap: 12px; padding: 2px 16px 12px;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap: 10px;">
              <button onClick="{{ toggleCustom }}" style="height: 34px; padding: 0 8px 0 2px; font-size: 14px; font-weight: 500;" style-hover="color: var(--blue-deep);">← Presets</button>
              <div role="group" aria-label="How many days" style="display:flex; gap: 2px; padding: 3px; background: var(--paper-2); border: 1px solid var(--line-soft); border-radius: 8px;">
                <sc-for list="{{ modes }}" as="m" hint-placeholder-count="2">
                  <button onClick="{{ m.set }}" style="height: 30px; padding: 0 10px; border-radius: 6px; font-size: 13px; font-weight: {{ m.weight }}; background: {{ m.bg }}; color: {{ m.ink }}; box-shadow: {{ m.ring }};">{{ m.label }}</button>
                </sc-for>
              </div>
            </div>
            <dc-import name="MonthCalendar" size="compact" cams="{{ calCams }}" sel-a="{{ calA }}" sel-b="{{ calB }}" on-pick="{{ onDay }}" hint-size="100%,330px"></dc-import>
            <sc-if value="{{ oneDay }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex; flex-direction:column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line-soft);">
                <div style="display:flex; align-items:center; justify-content:space-between; gap: 8px;">
                  <span style="font: 500 10.5px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);">{{ stripTitle }}</span>
                  <button onClick="{{ wholeDay }}" style="font-size: 12.5px; font-weight: 500; padding-bottom: 1px; border-bottom: 1px solid var(--line);" style-hover="border-color: var(--ink);">Whole day</button>
                </div>
                <div ref="{{ stripRef }}" onMouseDown="{{ sDown }}" onMouseMove="{{ sMove }}" style="position:relative; height: 44px; display:flex; align-items:flex-end; gap: 1px; cursor: crosshair; user-select:none;">
                  <sc-for list="{{ bars }}" as="b" hint-placeholder-count="96"><span style="flex:1; height: {{ b.h }}; border-radius: 1px; background: {{ b.c }};"></span></sc-for>
                  <span style="position:absolute; top:0; bottom:0; left:0; width: {{ dimL }}; background: color-mix(in oklch, var(--paper) 72%, transparent); pointer-events:none;"></span>
                  <span style="position:absolute; top:0; bottom:0; right:0; width: {{ dimR }}; background: color-mix(in oklch, var(--paper) 72%, transparent); pointer-events:none;"></span>
                  <span style="position:absolute; top: -3px; bottom: -3px; left: {{ selL }}; width: {{ selW }}; border-radius: 3px; box-shadow: inset 0 0 0 2px var(--blue); pointer-events:none;"></span>
                </div>
                <div style="position:relative; height: 12px; font: 500 10.5px/1 var(--font-mono); color: var(--muted);">
                  <span style="position:absolute; left: 0;">12 AM</span><span style="position:absolute; left: 25%; transform: translateX(-50%);">6 AM</span><span style="position:absolute; left: 50%; transform: translateX(-50%);">12 PM</span><span style="position:absolute; left: 75%; transform: translateX(-50%);">6 PM</span><span style="position:absolute; right: 0;">12 AM</span>
                </div>
                <span style="font-size: 12.5px; color: var(--muted);">Drag across the strip to choose the hours.</span>
              </div>
            </sc-if>
            <div style="display:flex; flex-direction:column; gap: 4px; padding: 10px 12px; background: var(--blue-tint); border-radius: 8px; color: var(--blue-deep);">
              <span style="font: 500 10.5px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase;">Chosen</span>
              <span style="font-size: 14.5px; font-weight: 500; text-wrap: pretty;">{{ pickText }}</span>
            </div>
            <button onClick="{{ useCustom }}" style="height: 42px; border-radius: 8px; background: var(--blue); color: var(--paper); font-size: 14.5px; font-weight: 500;" style-hover="background: var(--blue-2);">Use these dates and times</button>
          </div>
        </sc-if>
      </div>
      <div style="padding: 10px 16px; border-top: 1px solid var(--line-soft); font: 500 11px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted);">All times are site time</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:640},&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{preset:string, from?:number, to?:number}&quot;},&quot;now&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40800,&quot;tsType&quot;:&quot;number&quot;},&quot;defaultOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;customOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;pinned&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = Object.assign({ open: !!this.props.defaultOpen, custom: !!this.props.customOpen, ready: !!window.INVR }, this.seed());
  rootRef = React.createRef();
  stripRef = React.createRef();
  seed() {
    const I = window.INVR, p = this.props, DAY = 86400, now = p.now ?? 40800, v = p.value || { preset: 'today' };
    if (!I) return { cMode: 'one', cDay: 0, cH1: 0, cH2: null, cA: 0, cB: 0, cPend: false };
    const [a, b] = I.presetRange(v.preset, now, [v.from, v.to]), e = Math.min(b, Math.max(now, a + 900));
    const da = Math.floor(a / DAY), db = Math.floor((e - 1) / DAY);
    if (da !== db) return { cMode: 'many', cA: da, cB: db, cPend: false, cDay: db, cH1: 0, cH2: null };
    return { cMode: 'one', cDay: da, cH1: a - da * DAY, cH2: e - da * DAY, cA: da, cB: da, cPend: false };
  }
  componentDidMount() {
    if (!this.state.ready) { const t = () => window.INVR ? this.setState({ ready: true }) : setTimeout(t, 30); t(); }
    this.onDoc = e => { if (this.state.open && !this.props.pinned && this.rootRef.current && !this.rootRef.current.contains(e.target)) this.setState({ open: false }); };
    document.addEventListener('mousedown', this.onDoc);
    this.onUp = () => { this.drag = null; };
    window.addEventListener('mouseup', this.onUp);
    if (this.props.customOpen && window.INVR) this.setState(this.seed());
  }
  componentWillUnmount() { document.removeEventListener('mousedown', this.onDoc); window.removeEventListener('mouseup', this.onUp); }
  renderVals() {
    const I = window.INVR, p = this.props, s = this.state;
    if (!I) return { presetLabel: 'Today', rangeText: '', items: [], trigBorder: 'var(--line)' };
    const now = p.now ?? 40800;
    const v = p.value || { preset: 'today' };
    const [a, b] = I.presetRange(v.preset, now, [v.from, v.to]);
    const pr = I.PRESETS.find(k => k.key === v.preset) || I.PRESETS[5];
    const apply = val => { p.onChange && p.onChange(val); this.setState({ open: false }); };
    const items = I.PRESETS.filter(k => k.key !== 'custom').map(k => {
      const [x, y] = I.presetRange(k.key, now);
      const active = v.preset === k.key;
      const range = k.key === 'yesterday' ? 'All day, ' + I.dateShort(-1) : k.key === 'lastnight' ? '9:00 PM to 6:00 AM' : I.span(x, y);
      return { label: k.label, range, bg: active ? 'var(--blue-tint)' : 'transparent', mark: active ? 'var(--blue)' : 'transparent', weight: active ? 500 : 400, pick: () => apply({ preset: k.key }) };
    });
    const isCustom = v.preset === 'custom', DAY = 86400, seg = on => ({ bg: on ? 'var(--blue-tint)' : 'transparent', ink: on ? 'var(--blue-deep)' : 'var(--muted)', ring: on ? '0 0 0 1px var(--blue)' : 'none', weight: on ? 600 : 400 });
    const mode = s.cMode || 'one', cd = s.cDay ?? 0, dayNow = Math.min(DAY, Math.floor(now / 900) * 900 + 900), maxH = cd === 0 ? dayNow : DAY;
    const h1 = Math.min(s.cH1 ?? 0, maxH - 900), h2 = Math.min(maxH, Math.max(h1 + 900, s.cH2 ?? maxH));
    const cams = p.cams && p.cams.length ? p.cams : null, set = cams ? new Set(cams) : null, bins = new Array(96).fill(0);
    if (s.custom && mode === 'one') I.day(cd).forEach(e => { if (!set || set.has(e.cam)) { const k = Math.floor((e.t - cd * DAY) / 900); if (k >= 0 && k < 96) bins[k]++; } });
    const mxb = Math.max(1, ...bins);
    const bars = bins.map((n, k) => ({ h: (n ? Math.max(14, Math.round(n / mxb * 100)) : 6) + '%', c: k * 900 >= maxH || !n ? 'var(--paper-3)' : n / mxb > 0.66 ? 'var(--blue-deep)' : n / mxb > 0.33 ? 'var(--blue)' : 'var(--blue-tint)' }));
    const frac = e => { const el = this.stripRef.current; if (!el) return 0; const r = el.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
    const snap = f => Math.max(0, Math.min(maxH - 900, Math.floor(f * DAY / 900) * 900));
    const lo = Math.min(s.cA ?? 0, s.cB ?? 0), hi = Math.max(s.cA ?? 0, s.cB ?? 0);
    const camWord = !cams ? 'every camera' : cams.length === 1 ? (I.CAM[cams[0]] ? I.CAM[cams[0]].label : '1 camera') : cams.length + ' cameras';
    const pickText = mode === 'one' ? I.dayLong(cd) + ', ' + I.timesOnly(cd * DAY + h1, cd * DAY + h2) : s.cPend ? I.dayLong(lo) + '. Now pick the last day.' : lo === hi ? I.dayLong(lo) + ', all day' : I.dayLong(lo) + ' to ' + I.dayLong(hi);
    return {
      rootRef: this.rootRef,
      presetLabel: isCustom ? 'Picked' : pr.label, rangeText: I.rangeWords(a, b),
      trigBorder: s.open ? 'var(--blue)' : 'var(--line)',
      open: s.open, toggleOpen: () => this.setState(st => ({ open: !st.open })),
      items,
      showCustom: s.custom, showPresets: !s.custom, customCaret: '▸',
      customBg: isCustom ? 'var(--blue-tint)' : 'transparent', customMark: isCustom ? 'var(--blue)' : 'transparent', customWeight: isCustom ? 500 : 400,
      toggleCustom: () => this.setState(st => st.custom ? { custom: false } : Object.assign({ custom: true }, this.seed())),
      modes: [['one', 'One day'], ['many', 'Several days']].map(([k, l]) => Object.assign({ label: l, set: () => this.setState(st => k === 'one' ? { cMode: 'one', cDay: st.cB ?? st.cDay ?? 0, cH1: 0, cH2: null } : { cMode: 'many', cA: st.cDay ?? 0, cB: st.cDay ?? 0, cPend: true }) }, seg(mode === k))),
      calCams: cams, calA: mode === 'one' ? cd : lo, calB: mode === 'one' ? cd : hi,
      onDay: off => mode === 'one' ? this.setState({ cDay: off, cH1: 0, cH2: null }) : s.cPend ? this.setState(st => ({ cA: Math.min(st.cA, off), cB: Math.max(st.cA, off), cPend: false })) : this.setState({ cA: off, cB: off, cPend: true }),
      oneDay: mode === 'one', stripTitle: I.dayLong(cd) + ' · ' + camWord, bars, stripRef: this.stripRef,
      dimL: (h1 / DAY * 100) + '%', dimR: ((DAY - h2) / DAY * 100) + '%', selL: (h1 / DAY * 100) + '%', selW: ((h2 - h1) / DAY * 100) + '%',
      sDown: e => { const t = snap(frac(e)); this.drag = t; this.setState({ cH1: t, cH2: t + 900 }); },
      sMove: e => { if (this.drag == null) return; const t = snap(frac(e)); this.setState({ cH1: Math.min(this.drag, t), cH2: Math.max(this.drag, t) + 900 }); },
      wholeDay: () => this.setState({ cH1: 0, cH2: null }),
      pickText,
      useCustom: () => {
        if (mode === 'one') apply({ preset: 'custom', from: cd * DAY + h1, to: cd * DAY + h2 });
        else if (!s.cPend) apply({ preset: 'custom', from: lo * DAY, to: hi === 0 ? now : (hi + 1) * DAY });
        this.setState({ custom: false });
      }
    };
  }
}
</script>
</body>
</html>
