<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/brainy-neurals-design-system-326a1f72-00bc-4ae7-9c61-01f8fa61e24f/colors_and_type.css">
  <script src="invr-data.js"></script>
</helmet>
<sc-if value="{{ isCard }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex; flex-direction:column; background: {{ bg }}; border: 1px solid {{ border }}; box-shadow: {{ ring }}; border-radius: 8px; overflow:hidden; font-family: var(--font-sans); color: var(--ink);" style-hover="border-color: var(--ink);">
    <div onClick="{{ play }}" style="position:relative; aspect-ratio: 16 / 9; background: {{ scene }}; cursor:pointer;">
      <div style="position:absolute; left: {{ box.left }}; top: {{ box.top }}; width: {{ box.w }}; height: {{ box.h }}; border: 2px solid {{ box.color }}; border-radius: 2px; background: radial-gradient(ellipse at 50% 42%, rgba(225,230,236,.30), transparent 72%);"></div>
      <sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}">
        <span style="position:absolute; top:8px; left:8px; background: var(--blue); color: var(--paper); font: 500 10.5px/1 var(--font-mono); letter-spacing:.08em; text-transform:uppercase; padding: 5px 7px; border-radius: 4px;">Playing</span>
      </sc-if>
      <span style="position:absolute; right:8px; bottom:8px; background: rgba(10,10,11,.78); color: var(--paper); font: 500 11.5px/1 var(--font-mono); padding: 5px 6px; border-radius: 4px;">{{ dur }}</span>
    </div>
    <div style="display:flex; flex-direction:column; gap: 2px; padding: 10px 12px 12px;">
      <span style="align-self:flex-start; margin-bottom: 6px; padding: 4px 7px; border-radius: 4px; background: {{ kindBg }}; color: {{ kindInk }}; font: 500 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase;">{{ kind }}</span>
      <span style="font-size: 15px; font-weight: 500; letter-spacing: -0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ camLabel }}</span>
      <span style="font: 500 12px/1.4 var(--font-mono); color: var(--muted);">{{ when }}</span>
      <div style="display:flex; gap: 6px; margin-top: 8px;">
        <button onClick="{{ play }}" style="flex:1; height: 34px; display:flex; align-items:center; justify-content:center; gap: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); font-size: 13.5px; font-weight: 500;" style-hover="border-color: var(--ink);">
          <span style="width:0; height:0; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent;"></span>Play
        </button>
        <sc-if value="{{ selectable }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ toggle }}" aria-pressed="{{ selected }}" style="flex:1; height: 34px; display:flex; align-items:center; justify-content:center; gap: 7px; border: 1px solid {{ selBorder }}; border-radius: 6px; background: {{ selBg }}; color: {{ selInk }}; font-size: 13.5px; font-weight: 500;" style-hover="border-color: var(--ink);">
            <span style="width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid {{ selInk }}; background: {{ boxBg }}; color: var(--paper); font: 700 10px/11px var(--font-sans); text-align:center;">{{ check }}</span>{{ selLabel }}
          </button>
        </sc-if>
      </div>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isRow }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ play }}" role="button" aria-label="Play {{ kind }} on {{ camLabel }}, {{ when }}" style="display:grid; grid-template-columns: 96px minmax(0,1fr) 34px; align-items:center; gap: 12px; padding: 8px; border-radius: 8px; cursor:pointer; font-family: var(--font-sans); color: var(--ink);" style-hover="background: var(--blue-tint); color: var(--blue-deep);">
    <div style="position:relative; aspect-ratio: 16 / 9; border-radius: 4px; overflow:hidden; background: {{ scene }};">
      <div style="position:absolute; left: {{ box.left }}; top: {{ box.top }}; width: {{ box.w }}; height: {{ box.h }}; border: 1.5px solid {{ box.color }}; border-radius: 2px;"></div>
    </div>
    <div style="display:flex; flex-direction:column; gap: 3px; min-width:0;">
      <span style="font-size: 14.5px; font-weight: 500; line-height: 1.3; text-wrap: pretty;"><span style="display:inline-block; width: 8px; height: 8px; margin-right: 8px; vertical-align: 1px; background: {{ box.color }}; box-shadow: inset 0 0 0 1px {{ kindInk }};"></span>{{ kind }} · {{ camLabel }}</span>
      <span style="font: 500 12px/1.3 var(--font-mono); color: var(--muted);">{{ when }} · {{ dur }}</span>
    </div>
    <span style="width: 34px; height: 34px; display:flex; align-items:center; justify-content:center; border: 1px solid var(--line); border-radius: 50%; background: var(--paper);"><span style="width:0; height:0; margin-left: 2px; border-left: 9px solid var(--ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent;"></span></span>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:260},&quot;ev&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;EventView&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;card&quot;,&quot;row&quot;],&quot;default&quot;:&quot;card&quot;,&quot;tsType&quot;:&quot;'card' | 'row'&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;playing&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;selectable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onPlay&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(ev) =&gt; void&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(ev) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { ready: !!window.INVR };
  componentDidMount() {
    if (!this.state.ready) { const t = () => window.INVR ? this.setState({ ready: true }) : setTimeout(t, 30); t(); }
  }
  renderVals() {
    const p = this.props, I = window.INVR;
    const e = p.ev || (I ? { id: 'demo', kind: 'Person', type: 'person', camLabel: '3 Lobby corridor', when: 'Today 9:14 AM', dur: '38 s', scene: I.CAM[3].scene, x: 0.42 } : {});
    const isP = e.type !== 'vehicle', isO = e.type === 'other';
    const TONE = isO ? ['var(--teal)', 'var(--teal-tint)', 'var(--teal-deep)'] : isP ? ['var(--sky)', 'var(--sky-tint)', 'var(--sky-deep)'] : ['var(--honey)', 'var(--honey-tint)', 'var(--honey-deep)'];
    const w = isP ? 0.18 : 0.38;
    const sel = !!p.selected, playing = !!p.playing;
    return {
      isCard: p.variant !== 'row', isRow: p.variant === 'row',
      kind: e.kind, camLabel: e.camLabel, when: e.when, dur: e.dur, scene: e.scene,
      box: { left: (Math.min(e.x ?? 0.4, 1 - w - 0.04) * 100) + '%', top: isP ? '16%' : '34%', w: (w * 100) + '%', h: isP ? '70%' : '46%', color: TONE[0] }, kindBg: TONE[1], kindInk: TONE[2],
      playing, selected: sel,
      bg: sel ? 'var(--paper)' : 'var(--bone)',
      border: playing ? 'var(--ink)' : sel ? 'var(--blue)' : 'var(--line)',
      ring: sel ? '0 0 0 1px var(--blue)' : playing ? '0 0 0 1px var(--ink)' : 'none',
      selectable: p.selectable !== false,
      selLabel: sel ? 'Selected' : 'Select', check: sel ? '✓' : '',
      selBg: sel ? 'var(--blue-tint)' : 'var(--paper)', selInk: sel ? 'var(--blue-deep)' : 'var(--ink)', selBorder: sel ? 'var(--blue-deep)' : 'var(--line)',
      boxBg: sel ? 'var(--blue-deep)' : 'transparent',
      play: ev => { if (ev && ev.stopPropagation) ev.stopPropagation(); p.onPlay && p.onPlay(e); },
      toggle: ev => { if (ev && ev.stopPropagation) ev.stopPropagation(); p.onToggle && p.onToggle(e); }
    };
  }
}
</script>
</body>
</html>
