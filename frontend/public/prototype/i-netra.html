FFD;\n}\n\n\n:root {\n  /* --- COLOR --- */\n  /* Ink — primary text on light; dark-band background */\n  --ink:        #0A0A0B;\n  --ink-2:      #1A1A1D;   /* hover for dark surfaces */\n  --ink-3:      #2A2A2E;   /* borders inside dark surfaces */\n\n  /* Paper — light backgrounds + neutrals */\n  --paper:      #FFFFFF;   /* page background */\n  --paper-2:    #F4F4F2;   /* card neutral */\n  --paper-3:    #E8E8E4;   /* deeper neutral */\n  --bone:       #FAFAF8;   /* lightest off-white — most cards */\n\n  /* Lines */\n  --line:       rgba(10,10,11,0.14);   /* hairlines on light */\n  --line-soft:  rgba(10,10,11,0.08);   /* subtle hairlines */\n  --line-dark:  rgba(244,239,230,0.14);/* hairlines on dark */\n\n  /* Text on top of fields */\n  --muted:      rgba(10,10,11,0.58);   /* secondary on light */\n  --muted-dark: rgba(244,239,230,0.62);/* secondary on dark */\n\n  /* Brand accents */\n  --blue:       #0655FF;   /* anchor — accents, primary CTA */\n  --blue-2:     #0444CC;   /* primary CTA hover */\n  --blue-tint:  #DCE5FF;   /* pale blue text on dark */\n  --blue-deep:  #03257A;   /* deepest blue in gradients */\n\n  /* Sparing accents */\n  --signal:     #B5FF3C;   /* live-status / \"now\" — use 1-2x per page */\n  --rust:       #C2410C;   /* used once for variation; otherwise reserved */\n\n  /* --- v1.5 · BLUEPRINT PRODUCT PALETTE ---------------------------\n     Additive: every token above keeps its value. Six families for\n     product UI (status, tags, charts, avatars), each copying the blue\n     family's four tones:\n       base  = marks + solid fills      -2    = hover (one tone darker)\n       -tint = light backgrounds        -deep = text + icons on light\n     Never on buttons, links, focus rings, CTAs or section bands —\n     blue stays the only action color. */\n  --iris:        #7C63D6;   /* solid Iris carries Paper text */\n  --iris-2:      #654EB3;\n  --iris-tint:   #EFEEFE;\n  --iris-deep:   #493786;\n\n  --sky:         #52AFE7;\n  --sky-2:       #4395C6;\n  --sky-tint:    #E2F3FF;\n  --sky-deep:    #014D71;\n\n  --teal:        #1F9996;\n  --teal-2:      #0E7F7C;\n  --teal-tint:   #D9F7F6;\n  --teal-deep:   #055351;\n\n  --mint:        #4CBD88;\n  --mint-2:      #3EA273;\n  --mint-tint:   #DFF7E9;\n  --mint-deep:   #025636;\n\n  --honey:       #F3B539;\n  --honey-2:     #D49D31;\n  --honey-tint:  #FCEED9;\n  --honey-deep:  #5F4201;\n\n  --coral:       #EB6553;\n  --coral-2:     #C85343;\n  --coral-tint:  #FFEBE7;\n  --coral-deep:  #7E2319;\n\n  /* Status roles — components reference these, never the families,\n     so a role can be re-mapped here in one place.\n     --signal stays the live indicator and never means success. */\n  --success:      var(--mint);         /* @kind color */\n  --success-2:    var(--mint-2);       /* @kind color */\n  --success-tint: var(--mint-tint);    /* @kind color */\n  --success-deep: var(--mint-deep);    /* @kind color */\n  --warning:      var(--honey);        /* @kind color */\n  --warning-2:    var(--honey-2);      /* @kind color */\n  --warning-tint: var(--honey-tint);   /* @kind color */\n  --warning-deep: var(--honey-deep);   /* @kind color */\n  --danger:       var(--coral);        /* @kind color */\n  --danger-2:     var(--coral-2);      /* @kind color */\n  --danger-tint:  var(--coral-tint);   /* @kind color */\n  --danger-deep:  var(--coral-deep);   /* @kind color */\n  --info:         var(--blue);         /* @kind color */\n  --info-2:       var(--blue-2);       /* @kind color */\n  --info-tint:    var(--blue-tint);    /* @kind color */\n  --info-deep:    var(--blue-deep);    /* @kind color */\n\n  /* Chart sequence — assign series in this order so neighbours differ\n     in hue and lightness. Good-vs-bad charts use the status roles\n     instead. Rust stays out. */\n  --chart-1: var(--blue);    /* @kind color */\n  --chart-2: var(--honey);   /* @kind color */\n  --chart-3: var(--teal);    /* @kind color */\n  --chart-4: var(--coral);   /* @kind color */\n  --chart-5: var(--sky);     /* @kind color */\n  --chart-6: var(--iris);    /* @kind color */\n  --chart-7: var(--mint);    /* @kind color */\n\n  /* --- TYPE — families --- */\n  --font-sans:    \"IBM Plex Sans\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-mono:    \"IBM Plex Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n  --font-serif:   \"IBM Plex Serif\", \"Times New Roman\", serif;\n  /* `--font-display` is the italic-serif phrase accent. Same family as\n     serif, but always italic 400; used INSIDE headlines via <em>. */\n  --font-display: \"IBM Plex Serif\", \"Times New Roman\", serif;\n\n  /* --- TYPE — semantic styles ---\n     Reference these with `font: var(--type-h1)` or use the\n     `.h-display` / `.h-section` / `.h-card` classes from\n     `brainyneurals.css`. */\n  --type-h1:        500 clamp(40px, 6.4vw, 96px)/0.96 var(--font-sans);\n  --type-h2:        500 clamp(34px, 4.4vw, 64px)/1.02 var(--font-sans);\n  --type-h3:        500 22px/1.25 var(--font-sans);\n  --type-body:      400 17px/1.5  var(--font-sans);\n  --type-lede:      400 clamp(18px, 1.4vw, 22px)/1.45 var(--font-sans);\n  --type-small:     400 14.5px/1.55 var(--font-sans);\n  --type-mono:      500 12px/1.4 var(--font-mono);\n  --type-microcopy: 500 11px/1.3 var(--font-mono); /* + uppercase, +0.08em tracking */\n\n  /* Tracking values to apply alongside the fonts above */\n  --tr-h1: -0.035em;\n  --tr-h2: -0.030em;\n  --tr-h3: -0.015em;\n  --tr-micro: 0.08em;\n\n  /* --- RADII / SPACING --- */\n  --r-sm: 4px;\n  --r:    8px;\n  --r-lg: 14px;\n  --r-xl: 22px;\n\n  --container: 1320px;\n  --gutter: 32px;\n\n  /* --- MOTION --- */\n  --t1: cubic-bezier(.2,.7,.2,1);  /* @kind other */ /* default — most transitions */\n  --t2: cubic-bezier(.7,0,.3,1);   /* @kind other */ /* entries / exits */\n}\n\n/* ============================================================\n * Base type — opt-in. Drop on body to inherit the system.\n * ============================================================ */\n\n.bn-type, body.bn-type {\n  font: var(--type-body);\n  color: var(--ink);\n  background: var(--paper);\n  -webkit-font-smoothing: antialiased;\n  font-feature-settings: \"ss01\", \"cv11\";\n}\n\n/* Headline scale — italic <em> automatically swaps to serif italic */\n.bn-h1, h1.bn { font: var(--type-h1); letter-spacing: var(--tr-h1); margin: 0; }\n.bn-h2, h2.bn { font: var(--type-h2); letter-spacing: var(--tr-h2); margin: 0 0 24px; text-wrap: balance; }\n.bn-h3, h3.bn { font: var(--type-h3); letter-spacing: var(--tr-h3); margin: 0 0 10px; }\n.bn-h1 em, .bn-h2 em, .bn-h3 em, h1.bn em, h2.bn em, h3.bn em {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-weight: 400;\n  letter-spacing: -0.02em;\n}\n\n/* Lede / muted */\n.bn-lede { font: var(--type-lede); max-width: 820px; text-wrap: pretty; }\n.bn-muted { color: var(--muted); }\n\n/* Microcopy — section markers, \"engineering voice\" */\n.bn-micro {\n  font: var(--type-microcopy);\n  text-transform: uppercase;\n  letter-spacing: var(--tr-micro);\n  color: var(--muted);\n}\n\n/* Numeric / mono utility */\n.bn-mono  { font-family: var(--font-mono); font-feature-settings: \"tnum\"; }\n.bn-serif { font-family: var(--font-serif); font-weight: 400; }\n.bn-italic-accent { font-family: var(--font-display); font-style: italic; font-weight: 400; color: var(--blue); }\n\n/* ============================================================\n * Brainy Neurals — Design System Stylesheet\n * v1.0  ·  Editorial-engineering aesthetic\n *\n * Anchor brand color  : #0655FF\n * Ink                 : #0A0A0B\n * Paper (page bg)     : #FFFFFF\n * Off-white card      : #FAFAF8\n *\n * Type stack\n *   Sans     — \"Geist\"            (300/400/500/600/700)\n *   Mono     — \"IBM Plex Mono\"    (technical accents, labels)\n *   Display  — \"Instrument Serif\" (italic-only, headline accents)\n *\n * Add <link> to Google Fonts in your HTML <head> alongside this file:\n *   <link href=\"https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap\" rel=\"stylesheet\">\n *\n * See DESIGN_SYSTEM.md for full token table, component list, and section patterns.\n * ============================================================ */\n\n/* ============================================================\n   TOKENS\n   ============================================================ */\n:root {\n  --ink:        #0A0A0B;\n  --ink-2:      #1A1A1D;\n  --ink-3:      #2A2A2E;\n  --paper:      #FFFFFF;   /* white */\n  --paper-2:    #F4F4F2;   /* card neutral */\n  --paper-3:    #E8E8E4;   /* deeper accent neutral */\n  --bone:       #FAFAF8;   /* lightest off-white */\n  --line:       rgba(10,10,11,0.14);\n  --line-soft:  rgba(10,10,11,0.08);\n  --line-dark:  rgba(244,239,230,0.14);\n  --muted:      rgba(10,10,11,0.58);\n  --muted-dark: rgba(244,239,230,0.62);\n\n  --blue:       #0655FF;\n  --blue-2:     #0444CC;\n  --blue-tint:  #DCE5FF;\n  --blue-deep:  #03257A;\n  --signal:     #B5FF3C;   /* sparing — used once or twice */\n  --rust:       #C2410C;\n\n  /* v1.5 — Blueprint product palette. Additive: the 18 tokens above\n     and every rule below are unchanged. Same values as\n     colors_and_type.css. Families: base · -2 hover · -tint light bg ·\n     -deep text/icons on light. Product components only — never on\n     buttons, links, focus rings, CTAs or section bands. */\n  --iris:        #7C63D6;\n  --iris-2:      #654EB3;\n  --iris-tint:   #EFEEFE;\n  --iris-deep:   #493786;\n  --sky:         #52AFE7;\n  --sky-2:       #4395C6;\n  --sky-tint:    #E2F3FF;\n  --sky-deep:    #014D71;\n  --teal:        #1F9996;\n  --teal-2:      #0E7F7C;\n  --teal-tint:   #D9F7F6;\n  --teal-deep:   #055351;\n  --mint:        #4CBD88;\n  --mint-2:      #3EA273;\n  --mint-tint:   #DFF7E9;\n  --mint-deep:   #025636;\n  --honey:       #F3B539;\n  --honey-2:     #D49D31;\n  --honey-tint:  #FCEED9;\n  --honey-deep:  #5F4201;\n  --coral:       #EB6553;\n  --coral-2:     #C85343;\n  --coral-tint:  #FFEBE7;\n  --coral-deep:  #7E2319;\n  /* v1.5 status roles (success = Mint, never --signal) */\n  --success:      var(--mint);         /* @kind color */\n  --success-2:    var(--mint-2);       /* @kind color */\n  --success-tint: var(--mint-tint);    /* @kind color */\n  --success-deep: var(--mint-deep);    /* @kind color */\n  --warning:      var(--honey);        /* @kind color */\n  --warning-2:    var(--honey-2);      /* @kind color */\n  --warning-tint: var(--honey-tint);   /* @kind color */\n  --warning-deep: var(--honey-deep);   /* @kind color */\n  --danger:       var(--coral);        /* @kind color */\n  --danger-2:     var(--coral-2);      /* @kind color */\n  --danger-tint:  var(--coral-tint);   /* @kind color */\n  --danger-deep:  var(--coral-deep);   /* @kind color */\n  --info:         var(--blue);         /* @kind color */\n  --info-2:       var(--blue-2);       /* @kind color */\n  --info-tint:    var(--blue-tint);    /* @kind color */\n  --info-deep:    var(--blue-deep);    /* @kind color */\n  /* v1.5 chart sequence (rust stays out) */\n  --chart-1: var(--blue);    /* @kind color */\n  --chart-2: var(--honey);   /* @kind color */\n  --chart-3: var(--teal);    /* @kind color */\n  --chart-4: var(--coral);   /* @kind color */\n  --chart-5: var(--sky);     /* @kind color */\n  --chart-6: var(--iris);    /* @kind color */\n  --chart-7: var(--mint);    /* @kind color */\n\n  --r-sm: 4px;\n  --r:    8px;\n  --r-lg: 14px;\n  --r-xl: 22px;\n\n  --container: 1320px;\n  --gutter: 32px;\n\n  --t1: cubic-bezier(.2,.7,.2,1); /* @kind other */\n  --t2: cubic-bezier(.7,0,.3,1); /* @kind other */\n}\n\n/* ============================================================\n   BASE\n   ============================================================ */\n*,*::before,*::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }\n@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }\n\nbody {\n  margin: 0;\n  font-family: \"IBM Plex Sans\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  font-weight: 400;\n  font-size: 17px;\n  line-height: 1.5;\n  color: var(--ink);\n  background: var(--paper);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  font-feature-settings: \"ss01\", \"cv11\";\n}\n\nimg, svg { display: block; max-width: 100%; }\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }\ninput, select, textarea { font: inherit; color: inherit; }\n\n::selection { background: var(--ink); color: var(--paper); }\n\n.serif { font-family: \"IBM Plex Serif\", \"Times New Roman\", serif; font-weight: 400; letter-spacing: -0.01em; }\n.mono  { font-family: \"IBM Plex Mono\", ui-monospace, \"SF Mono\", Menlo, monospace; }\n\n/* Skip link */\n.skip { position: absolute; left: -9999px; top: 8px; background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: var(--r); z-index: 9999; }\n.skip:focus { left: 16px; }\n\n/* Focus */\n:focus-visible {\n  outline: 2px solid var(--blue);\n  outline-offset: 3px;\n  border-radius: 3px;\n}\n\n/* ============================================================\n   LAYOUT\n   ============================================================ */\n.wrap { max-width: var(--container); margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }\n.section { padding: 120px 0; position: relative; }\n.section-tight { padding: 80px 0; }\n\n.section-tag {\n  display: none;\n}\n.section-tag .num { color: var(--ink); font-weight: 500; }\n.section-tag .rule { flex: 0 0 64px; height: 1px; background: var(--line); }\n.dark .section-tag { color: var(--muted-dark); }\n.dark .section-tag .num { color: var(--bone); }\n.dark .section-tag .rule { background: var(--line-dark); }\n\n.h-display {\n  font-family: \"IBM Plex Sans\", sans-serif;\n  font-weight: 500;\n  font-size: clamp(40px, 6.4vw, 96px);\n  line-height: 0.96;\n  letter-spacing: -0.035em;\n  margin: 0;\n}\n.h-display em { font-style: italic; font-family: \"IBM Plex Serif\", serif; font-weight: 400; letter-spacing: -0.02em; }\n\n.h-section {\n  font-family: \"IBM Plex Sans\", sans-serif;\n  font-weight: 500;\n  font-size: clamp(34px, 4.4vw, 64px);\n  line-height: 1.02;\n  letter-spacing: -0.03em;\n  margin: 0 0 24px;\n  text-wrap: balance;\n}\n.h-section em { font-style: italic; font-family: \"IBM Plex Serif\", serif; font-weight: 400; }\n\n.h-card {\n  font-family: \"IBM Plex Sans\", sans-serif;\n  font-weight: 500;\n  font-size: 22px;\n  line-height: 1.25;\n  letter-spacing: -0.015em;\n  margin: 0 0 10px;\n}\n\n.lede {\n  font-size: clamp(18px, 1.4vw, 22px);\n  line-height: 1.45;\n  color: var(--ink);\n  max-width: 820px;\n  margin: 0 0 36px;\n  text-wrap: pretty;\n}\n.dark .lede { color: var(--bone); }\n\np { margin: 0 0 16px; }\np.muted { color: var(--muted); }\n.dark p.muted { color: var(--muted-dark); }\n\n/* dark bands */\n.dark { background: var(--ink); color: var(--bone); }\n.dark a { color: var(--bone); }\n.dark hr, .dark .hr { border-color: var(--line-dark); }\n\n/* hairline rules */\n.hr { height: 1px; background: var(--line); border: 0; margin: 0; }\n.dark .hr { background: var(--line-dark); }\n\n/* ============================================================\n   BUTTONS\n   ============================================================ */\n.btn {\n  display: inline-flex; align-items: center; gap: 10px;\n  height: 48px; padding: 0 22px;\n  border-radius: 999px;\n  font-family: \"IBM Plex Sans\", sans-serif;\n  font-size: 15px; font-weight: 500;\n  letter-spacing: -0.005em;\n  white-space: nowrap;\n  transition: transform .2s var(--t1), background .2s var(--t1), color .2s var(--t1), border-color .2s var(--t1);\n  min-height: 44px;\n}\n.btn .arr { transition: transform .25s var(--t1); }\n.btn:hover .arr { transform: translateX(4px); }\n.btn-primary { background: var(--blue); color: #fff; }\n.btn-primary:hover { background: var(--blue-2); }\n.btn-ink { background: var(--ink); color: var(--bone); }\n.btn-ink:hover { background: var(--ink-2); }\n.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }\n.btn-ghost:hover { border-color: var(--ink); }\n.dark .btn-ghost { color: var(--bone); border-color: var(--line-dark); }\n.dark .btn-ghost:hover { border-color: var(--bone); }\n.btn-text { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink); border-bottom: 1px solid transparent; padding-bottom: 2px; }\n.btn-text:hover { border-color: var(--ink); }\n.dark .btn-text { color: var(--bone); }\n.dark .btn-text:hover { border-color: var(--bone); }\n\n/* ============================================================\n   NAV (§0)\n   ============================================================ */\n.nav {\n  position: sticky; top: 0; z-index: 50;\n  background: rgba(255,255,255,0.78);\n  backdrop-filter: blur(12px) saturate(140%);\n  -webkit-backdrop-filter: blur(12px) saturate(140%);\n  border-bottom: 1px solid var(--line-soft);\n}\n.nav-inner {\n  display: flex; align-items: center; justify-content: space-between;\n  height: 64px; gap: 24px;\n}\n.brand { display: inline-flex; align-items: center; gap: 10px; }\n.brand-logo { height: 32px; width: auto; display: block; }\n.nav .brand-logo { height: 34px; }\n.footer-brand .brand-logo { height: 56px; }\n\n.nav-links { display: flex; align-items: center; gap: 8px; }\n.nav-link {\n  font-size: 14.5px; color: var(--ink); padding: 8px 12px; border-radius: 8px;\n  display: inline-flex; align-items: center; gap: 6px;\n  transition: background .15s var(--t1);\n}\n.nav-link:hover { background: rgba(10,10,11,0.06); }\n.nav-link .caret { font-size: 10px; opacity: .5; }\n.nav-cta { display: flex; align-items: center; gap: 12px; }\n.nav-mono { font-family: \"IBM Plex Mono\", monospace; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }\n.nav-mono .pulse { width: 6px; height: 6px; border-radius: 50%; background: #16A34A; box-shadow: 0 0 0 0 rgba(22,163,74,.6); animation: pulse 2s infinite; }\n@keyframes pulse { 0%{box-shadow: 0 0 0 0 rgba(22,163,74,.5);} 70%{box-shadow: 0 0 0 8px rgba(22,163,74,0);} 100%{box-shadow: 0 0 0 0 rgba(22,163,74,0);} }\n.nav-burger { display: none; }\n\n@media (max-width: 980px) {\n  .nav-links { display: none; }\n  .nav-mono { display: none; }\n  .nav-burger { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); }\n}\n\n/* ============================================================\n   §1 HERO\n   ============================================================ */\n.hero {\n  position: relative;\n  padding: 64px 0 96px;\n  overflow: hidden;\n}\n.hero-grid {\n  display: grid;\n  grid-template-columns: 1.35fr 0.95fr;\n  gap: 56px;\n  align-items: end;\n}\n.hero-eyebrow {\n  display: inline-flex; align-items: center; gap: 10px;\n  padding: 6px 12px 6px 8px;\n  border: 1px solid var(--line);\n  border-radius: 999px;\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 12px; letter-spacing: 0.02em;\n  background: var(--bone);\n  margin-bottom: 26px;\n}\n.hero-eyebrow .badge {\n  background: var(--ink); color: var(--paper);\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 10.5px; letter-spacing: 0.04em;\n  padding: 3px 8px; border-radius: 999px;\n}\n.hero h1 { margin-bottom: 28px; }\n.hero h1 em { color: var(--ink); }\n.hero h1 .blue { color: var(--blue); font-style: italic; font-family: \"IBM Plex Serif\", serif; font-weight: 400; }\n\n.hero-sub {\n  font-size: clamp(17px, 1.3vw, 20px);\n  line-height: 1.5;\n  color: var(--ink);\n  max-width: 640px;\n  margin-bottom: 36px;\n}\n.hero-sub .muted { color: var(--muted); }\n\n.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }\n\n/* proof marquee */\n.proof-marquee {\n  position: relative;\n  margin-top: 64px;\n  border-top: 1px solid var(--line);\n  border-bottom: 1px solid var(--line);\n  overflow: hidden;\n  --mq-h: 104px;\n  height: var(--mq-h);\n  background:\n    linear-gradient(90deg, var(--paper) 0, transparent 4%, transparent 96%, var(--paper) 100%),\n    repeating-linear-gradient(90deg, transparent 0 23px, rgba(10,10,11,0.04) 23px 24px),\n    var(--paper);\n}\n.proof-marquee::before, .proof-marquee::after {\n  content: \"\"; position: absolute; top: 0; bottom: 0; width: 96px; pointer-events: none; z-index: 2;\n}\n.proof-marquee::before { left: 0; background: linear-gradient(90deg, var(--paper), transparent); }\n.proof-marquee::after  { right: 0; background: linear-gradient(-90deg, var(--paper), transparent); }\n.proof-track {\n  display: flex;\n  align-items: center;\n  gap: 56px;\n  height: 100%;\n  width: max-content;\n  animation: pmscroll 48s linear infinite;\n}\n.proof-marquee:hover .proof-track { animation-play-state: paused; }\n@media (prefers-reduced-motion: reduce) {\n  .proof-track { animation: none; }\n}\n.pm-item {\n  display: inline-flex;\n  align-items: center;\n  gap: 14px;\n  flex-shrink: 0;\n  white-space: nowrap;\n}\n.pm-item .v {\n  font-family: \"IBM Plex Serif\", serif;\n  font-style: italic;\n  font-weight: 400;\n  font-size: 56px;\n  line-height: 1;\n  letter-spacing: -0.015em;\n  color: var(--ink);\n}\n.pm-item .v .plus { color: var(--blue); font-size: 0.7em; }\n.pm-item .v.mono {\n  font-family: \"IBM Plex Sans\", sans-serif;\n  font-style: normal;\n  font-weight: 500;\n  font-size: 30px;\n  letter-spacing: -0.025em;\n  display: inline-flex; align-items: center; gap: 8px;\n}\n.pm-item .v.mono::before {\n  content: \"\"; width: 6px; height: 6px; background: var(--blue); display: inline-block;\n}\n.pm-item .l {\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 11px;\n  text-transform: uppercase;\n  letter-spacing: 0.08em;\n  color: var(--muted);\n  line-height: 1.3;\n  white-space: normal;\n  max-width: 140px;\n}\n.pm-sep {\n  flex-shrink: 0;\n  width: 8px; height: 8px;\n  transform: rotate(45deg);\n  background: transparent;\n  border: 1px solid var(--blue);\n}\n@keyframes pmscroll {\n  from { transform: translate3d(0,0,0); }\n  to   { transform: translate3d(-50%, 0, 0); }\n}\n\n/* Hero right panel — live \"deployment status\" */\n.status-panel {\n  position: relative;\n  background: var(--ink);\n  color: var(--bone);\n  border-radius: var(--r-lg);\n  padding: 22px;\n  border: 1px solid var(--ink-3);\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 12.5px;\n  overflow: hidden;\n  box-shadow: 0 30px 60px -30px rgba(10,10,11,0.35), 0 2px 6px rgba(10,10,11,0.06);\n}\n.status-panel::before {\n  content: \"\";\n  position: absolute; inset: 0;\n  background:\n    linear-gradient(180deg, rgba(6,85,255,0.10), transparent 30%),\n    radial-gradient(120% 60% at 100% 0%, rgba(6,85,255,0.15), transparent 50%);\n  pointer-events: none;\n}\n.sp-head {\n  display: flex; align-items: center; justify-content: space-between;\n  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;\n  color: var(--muted-dark);\n  position: relative;\n}\n.sp-head .dots { display: flex; gap: 6px; }\n.sp-head .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }\n.sp-head .dots span:nth-child(1) { background: #5C5C66; }\n.sp-head .dots span:nth-child(2) { background: #3B3B42; }\n.sp-head .dots span:nth-child(3) { background: #2A2A2E; }\n.sp-title { color: var(--bone); margin-top: 14px; font-size: 13px; letter-spacing: 0.02em; position: relative; }\n.sp-title .sig { color: var(--signal); margin-right: 8px; }\n.sp-rule { height: 1px; background: var(--line-dark); margin: 14px 0 12px; position: relative; }\n\n.sp-rows { position: relative; display: flex; flex-direction: column; gap: 8px; }\n.sp-row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 10px; font-size: 12px; }\n.sp-row .ts { color: var(--muted-dark); }\n.sp-row .ev { color: var(--bone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.sp-row .val { color: var(--signal); font-weight: 500; }\n.sp-row .val.blue { color: #7AA0FF; }\n.sp-row .val.rust { color: #FFB089; }\n\n.sp-meter {\n  position: relative;\n  margin-top: 18px;\n  border: 1px solid var(--line-dark);\n  border-radius: 8px;\n  padding: 12px;\n}\n.sp-meter .meter-lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted-dark); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px; }\n.sp-meter .bars { display: grid; grid-template-columns: repeat(40, 1fr); gap: 2px; }\n.sp-meter .bars i { display: block; height: 18px; background: var(--ink-3); border-radius: 1px; }\n.sp-meter .bars i.on { background: var(--blue); }\n.sp-meter .bars i.sig { background: var(--signal); }\n\n.sp-foot { position: relative; margin-top: 14px; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted-dark); }\n.sp-foot .ok { color: var(--signal); }\n\n/* mobile hero */\n@media (max-width: 1024px) {\n  .hero-grid { grid-template-columns: 1fr; gap: 36px; }\n}\n@media (max-width: 540px) {\n  .pm-item .v { font-size: 44px; }\n  .pm-item .v.mono { font-size: 24px; }\n  .proof-marquee { --mq-h: 88px; }\n}\n\n/* ============================================================\n   §2 TRUST BAR — dark band so white client logos pop\n   ============================================================ */\n.trust {\n  padding: 80px 0 64px;\n  background: var(--ink);\n  color: var(--bone);\n  position: relative;\n  overflow: hidden;\n}\n.trust::before {\n  content: \"\"; position: absolute; inset: 0; pointer-events: none;\n  background-image:\n    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);\n  background-size: 64px 64px;\n  mask-image: linear-gradient(180deg, black, transparent 75%);\n  -webkit-mask-image: linear-gradient(180deg, black, transparent 75%);\n  opacity: 0.55;\n}\n.trust .wrap { position: relative; }\n.trust-head { display: none; }\n.trust-label {\n  display: flex; align-items: center; gap: 14px;\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;\n  color: var(--muted-dark);\n  margin-bottom: 36px;\n}\n.trust-label .rule { flex: 1; height: 1px; background: var(--line-dark); }\n.trust-label .count { color: var(--bone); }\n.trust-label .sig { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); display: inline-block; box-shadow: 0 0 0 0 rgba(181,255,60,.6); animation: pulse-sig 2s infinite; }\n\n/* Logo grid — 5×3 = 15 */\n.trust-logos {\n  display: grid;\n  grid-template-columns: repeat(5, 1fr);\n  gap: 1px;\n  background: var(--line-dark);\n  border: 1px solid var(--line-dark);\n  border-radius: var(--r-lg);\n  overflow: hidden;\n}\n.logo-slot {\n  padding: 24px 22px;\n  display: flex; align-items: center; justify-content: center;\n  background: var(--ink);\n  position: relative;\n  min-height: 112px;\n  border: 0;\n  transition: background .25s var(--t1);\n}\n.logo-slot:hover { background: var(--ink-2); }\n.logo-slot img {\n  max-width: 100%;\n  max-height: 52px;\n  width: auto;\n  height: auto;\n  object-fit: contain;\n  opacity: 0.82;\n  transition: opacity .25s var(--t1), transform .25s var(--t1);\n}\n.logo-slot:hover img { opacity: 1; }\n.logo-slot .micro {\n  position: absolute;\n  top: 10px; left: 12px;\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 9px;\n  color: rgba(255,255,255,0.28);\n  letter-spacing: 0.1em;\n}\n.logo-slot::after {\n  /* corner tick — bottom-right */\n  content: \"\";\n  position: absolute; right: 12px; bottom: 10px;\n  width: 5px; height: 5px;\n  border: 1px solid rgba(255,255,255,0.18);\n  border-left: 0; border-top: 0;\n}\n.logo-slot img {\n  max-height: 44px;\n}\n\n/* Cert/cloud badge cards — real images on light cards */\n.cert-grid {\n  display: grid;\n  grid-template-columns: repeat(6, 1fr);\n  gap: 12px;\n  margin-top: 28px;\n}\n.cert-card {\n  background: #fff;\n  border: 1px solid var(--line-dark);\n  border-radius: var(--r);\n  padding: 18px 16px;\n  display: flex; align-items: center; justify-content: center;\n  min-height: 110px;\n  position: relative;\n  transition: transform .25s var(--t1), box-shadow .25s var(--t1);\n}\n.cert-card:hover {\n  transform: translateY(-2px);\n  box-shadow: 0 12px 24px -10px rgba(0,0,0,0.4);\n}\n.cert-card img {\n  max-width: 100%;\n  max-height: 64px;\n  width: auto; height: auto;\n  object-fit: contain;\n}\n.cert-card .cert-tag {\n  position: absolute;\n  top: 8px; left: 10px;\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 8.5px;\n  color: var(--muted);\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n}\n.cert-card::after {\n  content: \"\";\n  position: absolute; right: 10px; bottom: 8px;\n  width: 5px; height: 5px;\n  border: 1px solid var(--line);\n  border-left: 0; border-top: 0;\n}\n@media (max-width: 1100px) { .cert-grid { grid-template-columns: repeat(3, 1fr); } }\n@media (max-width: 600px) { .cert-grid { grid-template-columns: repeat(2, 1fr); } }\n\n.trust-rows {\n  display: grid; grid-template-columns: 1fr 1fr; gap: 0;\n  margin-top: 40px;\n  border-top: 1px solid var(--line-dark);\n}\n.trust-row { padding: 22px 0; border-bottom: 1px solid var(--line-dark); display: flex; align-items: center; gap: 28px; }\n.trust-row .label { font-family: \"IBM Plex Mono\", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-dark); width: 140px; flex-shrink: 0; }\n.trust-row .items { display: flex; flex-wrap: wrap; gap: 12px 18px; }\n.badge-pill {\n  display: inline-flex; align-items: center; gap: 8px;\n  padding: 6px 12px 6px 8px;\n  border: 1px solid var(--line-dark); border-radius: 999px;\n  font-size: 13px; background: rgba(255,255,255,0.04);\n  color: var(--bone);\n}\n.badge-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }\n.badge-pill.iso .dot { background: #fff; }\n.badge-pill.aws .dot { background: #FF9900; }\n.badge-pill.ms .dot { background: #50E6FF; }\n.badge-pill.clutch .dot { background: #FF3D2E; }\n.badge-pill.upwork .dot { background: #14A800; }\n.badge-pill.nvidia .dot { background: #76B900; }\n\n.founder-strip {\n  margin-top: 40px;\n  padding: 24px;\n  background: rgba(255,255,255,0.04);\n  border: 1px solid var(--line-dark);\n  color: var(--bone);\n  border-radius: var(--r-lg);\n  display: flex; align-items: center; gap: 20px; justify-content: space-between;\n  flex-wrap: wrap;\n}\n.founder-strip .who { display: flex; align-items: center; gap: 14px; }\n.founder-strip .avatar {\n  width: 44px; height: 44px; border-radius: 50%;\n  background: var(--ink-2);\n  border: 1px solid var(--line-dark);\n  display: grid; place-items: center;\n  font-family: \"IBM Plex Mono\", monospace; font-size: 12px; color: var(--bone);\n}\n.founder-strip .label { font-family: \"IBM Plex Mono\", monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-dark); margin-bottom: 4px; }\n.founder-strip .name { font-size: 17px; font-weight: 500; }\n.founder-strip .name b { color: var(--bone); }\n.founder-strip .cred { font-size: 13px; color: var(--muted-dark); }\n.founder-strip .link { display: inline-flex; align-items: center; gap: 8px; color: var(--bone); border-bottom: 1px solid var(--line-dark); padding-bottom: 2px; }\n.founder-strip .link:hover { border-color: var(--bone); }\n\n@media (max-width: 1100px) {\n  .trust-logos { grid-template-columns: repeat(3, 1fr); }\n}\n@media (max-width: 900px) {\n  .trust-logos { grid-template-columns: repeat(3, 1fr); }\n  .trust-rows { grid-template-columns: 1fr; }\n}\n@media (max-width: 540px) {\n  .trust-logos { grid-template-columns: repeat(2, 1fr); }\n}\n\n/* ============================================================\n   §3 CASE STUDIES\n   ============================================================ */\n.cases-head { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: end; margin-bottom: 48px; }\n.cases-head .lede { margin: 0; }\n.cases-head .cta-side { justify-self: end; }\n\n.cases-grid {\n  display: grid;\n  grid-template-columns: 1.4fr 1fr 1fr;\n  grid-auto-rows: minmax(280px, auto);\n  gap: 1px;\n  background: var(--line);\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n  overflow: hidden;\n}\n.case-card {\n  background: var(--bone);\n  padding: 28px;\n  display: flex; flex-direction: column; gap: 16px;\n  position: relative;\n  transition: background .2s var(--t1);\n}\n.case-card:hover { background: #fff; }\n.case-card.featured {\n  grid-row: span 2;\n  background: var(--ink);\n  color: var(--bone);\n  padding: 36px;\n}\n.case-card.featured:hover { background: var(--ink-2); }\n\n.case-tag { font-family: \"IBM Plex Mono\", monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }\n.case-tag .sq { width: 8px; height: 8px; background: var(--blue); }\n.case-card.featured .case-tag { color: var(--muted-dark); }\n.case-card.featured .case-tag .sq { background: var(--signal); }\n\n.case-metric {\n  font-family: \"IBM Plex Sans\", sans-serif;\n  font-weight: 500;\n  font-size: clamp(36px, 4vw, 56px);\n  line-height: 0.98;\n  letter-spacing: -0.035em;\n  margin: 0;\n  text-wrap: balance;\n}\n.case-metric em { font-style: italic; font-family: \"IBM Plex Serif\", serif; font-weight: 400; }\n.case-card.featured .case-metric { font-size: clamp(44px, 5.4vw, 76px); }\n\n.case-desc { font-size: 14.5px; line-height: 1.55; color: var(--muted); }\n.case-card.featured .case-desc { color: var(--muted-dark); font-size: 16px; max-width: 540px; }\n\n.case-foot {\n  margin-top: auto;\n  display: flex; justify-content: space-between; align-items: center;\n  padding-top: 18px;\n  border-top: 1px solid var(--line);\n  font-family: \"IBM Plex Mono\", monospace; font-size: 11.5px; letter-spacing: 0.04em;\n}\n.case-card.featured .case-foot { border-top-color: var(--line-dark); }\n.case-foot .ba { color: var(--muted); }\n.case-card.featured .case-foot .ba { color: var(--muted-dark); }\n.case-foot .read { color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }\n.case-card.featured .case-foot .read { color: var(--bone); }\n.case-foot .read:hover { text-decoration: underline; }\n\n@media (max-width: 1024px) {\n  .cases-head { grid-template-columns: 1fr; }\n  .cases-head .cta-side { justify-self: start; }\n  .cases-grid { grid-template-columns: 1fr 1fr; }\n  .case-card.featured { grid-row: auto; grid-column: span 2; }\n}\n@media (max-width: 640px) {\n  .cases-grid { grid-template-columns: 1fr; }\n  .case-card.featured { grid-column: auto; }\n}\n\n/* ============================================================\n   §4 MID CTA — BLUE BAND (gradient + grid)\n   ============================================================ */\n.mid-cta {\n  position: relative;\n  padding: 88px 0;\n  background:\n    radial-gradient(80% 120% at 95% 0%, rgba(255,255,255,0.22), transparent 55%),\n    radial-gradient(70% 100% at 0% 100%, rgba(2,30,120,0.45), transparent 60%),\n    linear-gradient(115deg, #0858FF 0%, #0A48E0 55%, #0334B8 100%);\n  color: #fff;\n  border: 0;\n  overflow: hidden;\n}\n.mid-cta::before {\n  content: \"\"; position: absolute; inset: 0; pointer-events: none;\n  background-image:\n    linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);\n  background-size: 56px 56px;\n  background-position: -1px -1px;\n  mask-image: radial-gradient(circle at 30% 50%, black, transparent 85%);\n  -webkit-mask-image: radial-gradient(circle at 30% span-7, .span-6, .span-5, .span-4 { grid-column: span 12; }\n}\n\n/* ============================================================\n   §7 TESTIMONIALS\n   ============================================================ */\n.t-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }\n.t-card {\n  background: var(--bone); border: 1px solid var(--line); border-radius: var(--r-lg);\n  padding: 28px;\n  display: flex; flex-direction: column; gap: 18px;\n}\n.t-quote {\n  font-family: \"IBM Plex Serif\", serif;\n  font-weight: 400;\n  font-size: clamp(20px, 1.6vw, 24px);\n  line-height: 1.32;\n  letter-spacing: -0.01em;\n  color: var(--ink);\n  text-wrap: pretty;\n}\n.t-quote::before { content: \"“\"; color: var(--blue); margin-right: 2px; }\n.t-quote::after { content: \"”\"; color: var(--blue); }\n\n.t-meta { display: flex; align-items: center; gap: 14px; margin-top: auto; }\n.t-avatar {\n  width: 44px; height: 44px; border-radius: 50%;\n  background: var(--paper-3);\n  display: grid; place-items: center;\n  font-family: \"IBM Plex Mono\", monospace; font-size: 12px; color: var(--muted);\n}\n.t-who .name { font-size: 14.5px; font-weight: 500; line-height: 1.2; }\n.t-who .co { font-size: 13px; color: var(--muted); }\n\n.t-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px solid var(--line); }\n.t-stars { color: var(--blue); letter-spacing: 0.1em; font-size: 13px; }\n.t-verified { font-family: \"IBM Plex Mono\", monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }\n.t-verified:hover { color: var(--ink); }\n\n@media (max-width: 900px) { .t-grid { grid-template-columns: 1fr; } }\n\n/* ============================================================\n   §8 SECOND CTA HOOK (blue, atmospheric)\n   ============================================================ */\n.cta-hook {\n  position: relative;\n  padding: 140px 0;\n  text-align: center;\n  color: #fff;\n  background:\n    radial-gradient(50% 70% at 50% 30%, rgba(122,160,255,0.45), transparent 70%),\n    radial-gradient(80% 60% at 100% 100%, rgba(2,20,90,0.55), transparent 65%),\n    radial-gradient(80% 60% at 0% 100%, rgba(2,20,90,0.55), transparent 65%),\n    linear-gradient(180deg, #0A5CFF 0%, #0633B5 70%, #021E78 100%);\n  overflow: hidden;\n}\n.cta-hook::before {\n  content: \"\"; position: absolute; inset: -2px; pointer-events: none;\n  background-image:\n    radial-gradient(circle at center, rgba(255,255,255,0.18) 1px, transparent 1.4px);\n  background-size: 28px 28px;\n  mask-image: radial-gradient(circle at 50% 50%, black, transparent 70%);\n  -webkit-mask-image: radial-gradient(circle at 50% 50%, black, transparent 70%);\n  opacity: 0.6;\n}\n.cta-hook::after {\n  /* concentric rings emanating from center */\n  content: \"\"; position: absolute; inset: 0; pointer-events: none;\n  background:\n    repeating-radial-gradient(circle at 50% 50%, transparent 0 80px, rgba(255,255,255,0.04) 80px 81px);\n  mask-image: radial-gradient(circle at 50% 50%, transparent 5%, black 25%, transparent 85%);\n  -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 5%, black 25%, transparent 85%);\n}\n.cta-hook .wrap { position: relative; z-index: 1; }\n.cta-hook .h {\n  font-family: \"IBM Plex Sans\", sans-serif;\n  font-weight: 500;\n  font-size: clamp(36px, 4.6vw, 64px);\n  line-height: 1.02; letter-spacing: -0.03em;\n  margin: 0 0 28px;\n  max-width: 22ch; margin-inline: auto;\n  text-wrap: balance;\n  color: #fff;\n}\n.cta-hook .h em { font-style: italic; font-family: \"IBM Plex Serif\", serif; font-weight: 400; color: rgba(255,255,255,0.78); }\n.cta-hook .btn-primary { background: #fff; color: var(--blue); }\n.cta-hook .btn-primary:hover { background: var(--ink); color: #fff; }\n\n/* ============================================================\n   §9 INDUSTRIES\n   ============================================================ */\n.ind-core { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-bottom: 40px; }\n.ind-card {\n  border: 1px solid var(--line); border-radius: var(--r-lg);\n  padding: 32px;\n  background: var(--bone);\n  display: flex; flex-direction: column; gap: 16px;\n}\n.ind-card .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }\n.ind-card h3 { font-size: clamp(22px, 1.8vw, 28px); font-weight: 500; letter-spacing: -0.02em; margin: 0; line-height: 1.15; }\n.ind-card .core { background: var(--blue); color: #fff; padding: 3px 9px; border-radius: 999px; font-family: \"IBM Plex Mono\", monospace; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }\n.ind-card .desc { font-size: 14.5px; line-height: 1.55; color: var(--muted); margin: 0; }\n.ind-card .signal { display: flex; align-items: center; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }\n.ind-card .signal .label { font-family: \"IBM Plex Mono\", monospace; font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }\n.ind-card .signal .val {\n  font-family: \"IBM Plex Sans\", sans-serif;\n  font-size: 16px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink);\n}\n.ind-card .signal .val em { font-style: italic; font-family: \"IBM Plex Serif\", serif; font-weight: 400; color: var(--blue); }\n\n.ind-std-head { font-family: \"IBM Plex Mono\", monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 32px 0 16px; padding-top: 24px; border-top: 1px solid var(--line); }\n.ind-std {\n  display: grid; grid-template-columns: repeat(2, 1fr); gap: 0;\n}\n.ind-std .row { display: grid; grid-template-columns: 1.1fr 2fr; gap: 24px; padding: 20px 0; border-bottom: 1px solid var(--line); }\n.ind-std .row .name { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }\n.ind-std .row .blurb { font-size: 14px; color: var(--muted); line-height: 1.5; }\n\n@media (max-width: 900px) {\n  .ind-core { grid-template-columns: 1fr; }\n  .ind-std { grid-template-columns: 1fr; }\n}\n\n/* ============================================================\n   §10 FOUNDER + TEAM\n   ============================================================ */\n.founder {\n  display: grid; grid-template-columns: 0.9fr 1.3fr; gap: 64px; align-items: center;\n}\n.founder-photo {\n  aspect-ratio: 4/5;\n  background: linear-gradient(180deg, var(--paper-3), var(--paper-2));\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n  position: relative; overflow: hidden;\n  display: flex; align-items: end; justify-content: start;\n  padding: 24px;\n}\n.placeholder-tag {\n  position: absolute; top: 16px; left: 16px;\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: var(--muted);\n  background: rgba(255,255,255,0.85);\n  padding: 4px 8px; border-radius: 4px;\n  border: 1px dashed var(--line);\n}\n.founder-photo .silhouette {\n  width: 100%; aspect-ratio: 1/1;\n  background: radial-gradient(ellipse at 50% 30%, rgba(10,10,11,0.18), transparent 60%),\n              radial-gradient(ellipse at 50% 80%, rgba(10,10,11,0.12), transparent 65%);\n  position: absolute; bottom: -10%; left: 0;\n}\n.founder-photo .cap {\n  position: relative;\n  color: var(--ink);\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 11px; letter-spacing: 0.05em;\n  background: var(--bone);\n  border: 1px solid var(--line);\n  padding: 8px 12px; border-radius: 4px;\n  z-index: 2;\n}\n\n.founder-copy h2 { margin-bottom: 24px; }\n.founder-copy p { font-size: 16px; line-height: 1.6; color: var(--ink); }\n.founder-copy p.muted { color: var(--muted); }\n.founder-meta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }\n.cred-badge {\n  display: inline-flex; align-items: center; gap: 8px;\n  padding: 8px 14px;\n  background: var(--ink); color: var(--bone);\n  border-radius: 999px; font-size e; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }\n\n.roles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }\n.role-card {\n  padding: 20px; background: var(--bone); border: 1px solid var(--line); border-radius: var(--r);\n  display: flex; flex-direction: column; gap: 12px;\n}\n.role-head { display: flex; gap: 12px; align-items: center; }\n.role-headshot {\n  width: 40px; height: 40px; border-radius: 50%;\n  background: var(--paper-3);\n  border: 1px dashed var(--line);\n  position: relative; flex-shrink: 0;\n}\n.role-headshot::after {\n  content: \"\"; position: absolute; inset: 8px;\n  background: radial-gradient(ellipse at 50% 30%, rgba(10,10,11,0.25), transparent 70%);\n  border-radius: 50%;\n}\n.role-num { font-family: \"IBM Plex Mono\", monospace; font-size: 10px; letter-spacing: 0.06em; color: var(--muted); }\n.role-title { font-size: 15px; font-weight: 500; letter-spacing: -0.005em; line-height: 1.25; margin: 0; }\n.role-cred { font-family: \"IBM Plex Mono\", monospace; font-size: 11.5px; line-height: 1.4; color: var(--muted); }\n\n@media (max-width: 1024px) {\n  .founder { grid-template-columns: 1fr; gap: 32px; }\n  .roles { grid-template-columns: repeat(2, 1fr); }\n}\n@media (max-width: 540px) {\n  .roles { grid-template-columns: 1fr; }\n  .team-stats { grid-template-columns: 1fr; }\n  .team-stat { border-right: 0; border-bottom: 1px solid var(--line); }\n  .team-stat:last-child { border-bottom: 0; }\n}\n\n/* ============================================================\n   §11 HOW WE WORK\n   ============================================================ */\n.how-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }\n.how-method { }\n.how-method h3, .how-models h3, .how-comms h3 {\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: var(--muted);\n  margin: 0 0 24px;\n}\n.timeline { position: relative; padding : 11px; }\n.footer-col a { color: var(--bone); font-size: 14px; transition: color .15s var(--t1); }\n.footer-col a:hover { color: #7AA0FF; }\n/* Stacked column = Company on top of Connect */\n.footer-stack { display: flex; flex-direction: column; gap: 28px; }\n.footer-sub h4 { margin-top: 28px; }\n/* Bottom row — 3 columns: copyright LEFT, social CENTER, legal RIGHT */\n.footer-bot {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  padding-top: 28px;\n  gap: 16px;\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 11px;\n  color: var(--muted-dark);\n  letter-spacing: 0.04em;\n}\n.footer-bot > :first-child { justify-self: start; }\n.footer-bot > :nth-child(2) { justify-self: center; }\n.footer-bot > :last-child { justify-self: end; }\n.footer-bot .legal { display: flex; gap: 24px; }\n.footer-bot a:hover { color: var(--bone); }\n\n@media (max-width: 980px) {\n  .footer-top { grid-template-columns: 1fr 1fr; }\n  .footer-bot { grid-template-columns: 1fr; justify-items: start; gap: 18px; }\n  .footer-bot > :first-child,\n  .footer-bot > :nth-child(2),\n  .footer-bot > :last-child { justify-self: start; }\n}\n@media (max-width: 540px) {\n  .footer-top { grid-template-columns: 1fr; }\n}\n\n/* Sticky CTA */\n.sticky-cta {\n  position: fixed;\n  bottom: 20px;\n  left: 50%;\n  transform: translate(-50%, 80px);\n  z-index: 60;\n  display: inline-flex; align-items: center; gap: 12px;\n  padding: 8px 8px 8px 18px;\n  background: var(--ink);\n  color: var(--bone);\n  border-radius: 999px;\n  font-size: 14px;\n  box-shadow: 0 18px 40px -10px rgba(10,10,11,0.4);\n  transition: transform .35s var(--t1), opacity .25s var(--t1);\n  opacity: 0;\n  pointer-events: none;\n}\n.sticky-cta.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }\n.sticky-cta .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 0 rgba(181,255,60,.6); animation: pulse-sig 2s infinite; }\n@keyframes pulse-sig { 0%{box-shadow: 0 0 0 0 rgba(181,255,60,.5);} 70%{box-shadow: 0 0 0 8px rgba(181,255,60,0);} 100%{box-shadow: 0 0 0 0 rgba(181,255,60,0);} }\n.sticky-cta a.cta-btn { background: var(--blue); color: #fff; padding: 8px 14px; border-radius: 999px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }\n.sticky-cta a.cta-btn:hover { background: var(--blue-2); }\n\n/* Back to top */\n.btt {\n  position: fixed;\n  bottom: 20px; right: 20px;\n  width: 44px; height: 44px;\n  background: var(--ink); color: var(--bone);\n  border-radius: 50%;\n  display: grid; place-items: center;\n  z-index: 60;\n  opacity: 0; transform: translateY(20px); pointer-events: none;\n  transition: opacity .3s var(--t1), transform .3s var(--t1);\n  box-shadow: 0 8px 24px rgba(10,10,11,0.25);\n}\n.btt.show { opacity: 1; transform: translateY(0); pointer-events: auto; }\n.btt:hover { background: var(--ink-2); }\n\n/* viewport entry */\n.fade-up { opacity: 0; transform: translateY(16px); transition: opacity .7s var(--t1), transform .7s var(--t1); }\n.fade-up.in { opacity: 1; transform: translateY(0); }\n\n/* helpers */\n.center { text-align: center; }\n.flex { display: flex; }\n.between { justify-content: space-between; }\n.aic { align-items: center; }\n/* ============================================================\n   §0.b SOCIAL ROW (added v1.2)\n   Mono-on-ink 32px hit circles; mark uses currentColor.\n   Hover lifts the dark inversion to bone for a quiet contrast bump.\n   ============================================================ */\n.social-row {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n}\n.social-row .social {\n  width: 36px;\n  height: 36px;\n  display: inline-grid;\n  place-items: center;\n  border-radius: 999px;\n  background: rgba(255,255,255,0.04);\n  border: 1px solid var(--line-dark);\n  color: var(--muted-dark);\n  transition: background .2s var(--t1), color .2s var(--t1), border-color .2s var(--t1);\n}\n.social-row .social:hover {\n  background: rgba(255,255,255,0.10);\n  border-color: var(--bone);\n  color: var(--bone);\n}\n.social-row .social img {\n  width: 16px;\n  height: 16px;\n  display: block;\n  /* simple-icons SVGs are black by default; invert to bone on ink */\n  filter: invert(1) brightness(1.2);\n  opacity: 0.82;\n  transition: opacity .2s var(--t1);\n}\n.social-row .social:hover img { opacity: 1; }\n\n/* Light-surface variant (e.g. on a white section) */\n.social-row.light .social {\n  background: var(--bone);\n  border-color: var(--line);\n  color: var(--muted);\n}\n.social-row.light .social:hover {\n  background: #fff;\n  border-color: var(--ink);\n  color: var(--ink);\n}\n.social-row.light .social img {\n  filter: none;\n  opacity: 0.72;\n}\n.social-row.light .social:hover img { opacity: 1; }\n\n/* \"Color\" modifier: each platform paints its mark in its brand color on hover.\n   Off-state stays neutral monochrome — color only appears on intent. */\n.social-row.color .social:hover[data-net=\"linkedin\"] { background: #0A66C2; border-color: #0A66C2; }\n.social-row.color .social:hover[data-net=\"x\"]        { background: #000000; border-color: #ffffff; }\n.social-row.color .social:hover[data-net=\"youtube\"]  { background: #FF0000; border-color: #FF0000; }\n.social-row.color .social:hover[data-net=\"instagram\"]{\n  background: radial-gradient(circle at 30% 110%, #FFD600 0%, #FF7A00 25%, #FF0069 50%, #D300C5 75%, #7638FA 100%);\n  border-color: transparent;\n}\n.social-row.color .social:hover img { filter: invert(1) brightness(1.2); opacity: 1; }\n.social-row.color.light .social:hover img { filter: invert(1) brightness(1.2); opacity: 1; }\n\n/* ============================================================\n   §0.c OFFICE-LIFE STRIP (added v1.3)\n   3-up row of photos from inside the office. Sits under the\n   team hero shot.\n   ============================================================ */\n.office-strip {\n  display: grid;\n  grid-template-columns: 1.4fr 1fr 1fr;\n  gap: 16px;\n  margin-top: 24px;\n}\n.office-strip .shot {\n  aspect-ratio: 3/2;\n  border-radius: var(--r-lg);\n  background-size: cover;\n  background-position: center;\n  border: 1px solid var(--line);\n  position: relative;\n  overflow: hidden;\n  transition: transform .35s var(--t1);\n}\n.office-strip a.shot:hover { transform: translateY(-2px); }\n.office-strip .shot .cap {\n  position: absolute;\n  left: 12px; bottom: 12px;\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 10.5px;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--ink);\n  background: rgba(255,255,255,0.92);\n  border: 1px solid var(--line);\n  padding: 4px 8px;\n  border-radius: 4px;\n}\n@media (max-width: 900px) {\n  .office-strip { grid-template-columns: 1fr 1fr; }\n  .office-strip .shot:nth-child(3) { display: none; }\n}\n\n/* ============================================================\n   §0.d PEOPLE GRID (added v1.4)\n   Real team portraits. Square crops from assets/team/people/,\n   5-up on desktop, with a mono index chip on each photo.\n   ============================================================ */\n.people-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }\n.person-card {\n  display: flex; flex-direction: column;\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n  background: var(--bone);\n  overflow: hidden;\n  transition: background .2s var(--t1), transform .3s var(--t1);\n}\n.person-card:hover { background: #fff; transform: translateY(-2px); }\n.person-photo {\n  aspect-ratio: 1 / 1;\n  background-color: var(--paper-3);\n  background-size: cover;\n  background-position: center 20%;\n  position: relative;\n}\n.person-ix {\n  position: absolute; top: 10px; left: 12px;\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 9.5px; letter-spacing: 0.1em;\n  color: #fff; background: rgba(10,10,11,0.55);\n  padding: 3px 6px; border-radius: var(--r-sm);\n}\n.person-body { padding: 13px 15px 15px; }\n.person-name {\n  margin: 0;\n  font-family: \"IBM Plex Sans\", sans-serif;\n  font-weight: 500; font-size: 15.5px;\n  letter-spacing: -0.01em; line-height: 1.25;\n}\n.person-role {\n  margin-top: 5px;\n  font-family: \"IBM Plex Mono\", monospace;\n  font-size: 10.5px; letter-spacing: 0.07em;\n  text-transform: uppercase; color: var(--muted);\n}\n.dark .person-card { background: var(--ink-2); border-color: var(--ink-3); }\n.dark .person-name { color: var(--bone); }\n.dark .person-role { color: var(--muted-dark); }\n@media (max-width: 1100px) { .people-grid { grid-template-columns: repeat(4, 1fr); } }\n@media (max-width: 900px)  { .people-grid { grid-template-columns: repeat(3, 1fr); } }\n@media (max-width: 600px)  { .people-grid { grid-template-columns: repeat(2, 1fr); } }\n\n/* Team-photo block — when a real photo is supplied, drop the\n   placeholder gradient via .team-photo.photo */\n.team-photo.photo { background: var(--ink); }\n.team-photo.photo::after { display: none; }\n.team-photo.photo .placeholder-tag { display: none; }\n\n.gap-16 { gap: 16px; }\n.gap-24 { gap: 24px; }\n\n/* ============================================================\n   §12.b TECH STACK — icon chip variant (added v1.1)\n   Pair real product marks (monochrome SVGs) with the chip label.\n   Marks inherit currentColor so a single asset works on light or\n   dark backgrounds.\n   ============================================================ */\n\n/* Dark variant of stack card — for an ink-band tech stack section */\n.stack-card-dark {\n  background: var(--ink-2);\n  border-color: var(--ink-3);\n  color: var(--bone);\n}\n.stack-card-dark .stack-head { border-bottom-color: var(--line-dark); }\n.stack-card-dark .stack-icon {\n  background: var(--bone);\n  color: var(--ink);\n}\n.stack-card-dark .stack-title { color: var(--bone); }\n\n/* Icon-bearing chip — name + monochrome mark */\n.stack-chip.stack-chip-icon {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  padding: 5px 10px 5px 7px;\n}\n.stack-chip.stack-chip-icon .chip-mark {\n  width: 14px;\n  height: 14px;\n  display: block;\n  object-fit: contain;\n  /* simple-icons SVGs default to black; coerce to currentColor via filter */\n}\n/* Light card → black mark sits on bone */\n.stack-card .stack-chip.stack-chip-icon .chip-mark { filter: none; }\n/* Dark card → invert so black mark becomes bone */\n.stack-card-dark .stack-chip.stack-chip-icon {\n  background: rgba(255,255,255,0.04);\n  border-color: var(--line-dark);\n  color: var(--bone);\n}\n.stack-card-dark .stack-chip.stack-chip-icon .chip-mark {\n  filter: invert(1) brightness(1.2);\n}\n<\u002Fstyle>\n  <script src=\"70dc3082-55b1-4738-9f67-89e67e15f794\"><\u002Fscript>\n  <script src=\"5a97598b-05bb-48b9-8fb5-d4b8deddc6ee\"><\u002Fscript>\n  <style>html, body { margin: 0; height: 100%; background: #FFFFFF; overflow: hidden; } a:not(.btn):not(.btn-text) { color: var(--ink); } a:not(.btn):not(.btn-text):hover { color: var(--blue); } a.btn-primary, a.btn-primary:hover, a.btn-ink, a.btn-ink:hover { color: var(--paper); }<\u002Fstyle>\n  \n<\u002Fhelmet>\n<div data-screen-label=\"i-Netra prototype\" style=\"width:100vw; height:100vh;\">\n  <dc-import name=\"InvrApp\" style=\"width:100%; height:100%;\" hint-size=\"100%,100%\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
