# AIVISRA StreamCore - normal operation is configured in this one file.
runtime:
  mode: production
  max_frame_age_seconds: 2

streams:
  rtsp_latency_ms: 500
  reconnect_initial_seconds: 1
  reconnect_max_seconds: 15
  frame_timeout_seconds: 15
  reconnect_reset_seconds: 30

live_view:
  enabled: true
  provider: mediamtx
  protocol: webrtc
  # Control API is intentionally loopback-only in the Virtual CCTV config.
  mediamtx_api_url: http://127.0.0.1:9997
  # This URL is returned to browsers; use the MediaMTX LAN IP or DNS name.
  mediamtx_webrtc_base_url: http://127.0.0.1:8889
  request_timeout_seconds: 2

decode:
  prefer_hardware: true
  fallback_software: true

ai:
  # Enable after selecting dummy or ultralytics below. Live WebRTC is independent.
  enabled: true
  target_fps: 24
  max_total_fps: 1200.0 # Uncapped to find hardware max ceiling
  poll_interval_ms: 1.0

inference:
  detector: ultralytics
  max_batch_size: 16
  model_path: yolo11n.pt
  device: "0"
  imgsz: 640
  half: true
  gpu_native: true
  fallback_cpu_frames: true
  max_batch_wait_ms: 5.0
  frame_path: "gpu"
  detection_classes: [0]
  person_conf_threshold: 0.5

tracking:
  enabled: true
  tracker: bytetrack
  class_aware: true
  min_hits_to_confirm: 3
  lost_timeout_ms: 1000
  end_timeout_ms: 3000
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  match_thresh: 0.8
  max_trajectory_points: 128
  minimum_crop_improvement: 0.05
  export_json: false
  output_path: runtime/streamcore/output/tracks.jsonl

diagnostic_preview:
  enabled: true
  fps: 24
  width: 1280
  height: 720
  jpeg_quality: 75

evidence:
  enabled: true
  key_frames_per_track: 3
  local_output_dir: runtime/streamcore/output

events:
  enabled: true
  clip_duration_seconds: 10
  clip_storage_dir: runtime/streamcore/output/clips
  retention_days: 1
  max_concurrent_recordings: 2
  record_on_track_confirmed: true

monitoring:
  print_interval_seconds: 5

# Camera URI stays server-side. live_path is the corresponding MediaMTX path.
cameras:
  - {id: CAM001, uri: 'rtsp://127.0.0.1:8554/cam001', codec: h264, decoder: auto, live_path: cam001, enabled: true}
